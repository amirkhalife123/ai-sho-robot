name: AI Sho Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 10 * * *'
    - cron: '30 17 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: نصب درخواست‌ها
        run: pip install requests

      - name: اجرای ربات
        run: python -u bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
